# A manifest may be BOTH a package and a workspace root, and this one is. The
# broker crate lives at broker/ and is a member; `moe-windows-job-core` keeps
# its existing layout (src/ and tests/ stay exactly where they are).
#
# WHY NOT A VIRTUAL WORKSPACE WITH THE CORE MOVED TO core/. That shape is the
# textbook one, and it is wrong here: it relocates nine source files owned by
# two completed tasks and invalidates the verification commands recorded in
# their evidence, for no benefit this crate can observe. Adding this table
# moves zero existing files.
#
# The resolver is 2 by inheritance from the root package's `edition = "2021"`,
# so no explicit `resolver` key is needed and none is added.
[workspace]
members = ["broker"]

[package]
name = "moe-windows-job-core"
version = "0.1.0"
edition = "2021"
# Never published to crates.io. This crate is an internal native primitive
# consumed by the Node runner, not a distributable library.
publish = false

# windows-sys is declared per-target: this crate implements a Windows-only
# primitive and deliberately has NO non-Windows fallback. A fallback would be
# untested authority on a host that cannot exercise it.
#
# The leading `=` is an EXACT version pin, not a caret range. `=0.61.2` forbids
# 0.61.3; a plain "0.61.2" would silently accept it.
#
# Win32_Security is required, not convenience: CreateJobObjectW is declared
# `#[cfg(feature = "Win32_Security")]` because its first parameter is
# *const SECURITY_ATTRIBUTES. Without it the function does not exist. We pass
# NULL for that parameter, but the feature still gates the declaration.
#
# Win32_System_Threading was deliberately absent while this crate only
# configured a Job. It is now REQUIRED: CreateProcessW, STARTUPINFOEXW,
# CREATE_SUSPENDED, CREATE_UNICODE_ENVIRONMENT, EXTENDED_STARTUPINFO_PRESENT,
# the whole PROC_THREAD_ATTRIBUTE_* family (JOB_LIST, HANDLE_LIST,
# InitializeProcThreadAttributeList, UpdateProcThreadAttribute,
# DeleteProcThreadAttributeList) and ResumeThread are ALL declared in
# Win32/System/Threading. Without the feature none of them exist.
#
# CORRECTION, measured on a real kernel by tests/real_windows.rs. This comment
# used to claim the Job side deliberately used JOBOBJECT_BASIC_LIMIT_INFORMATION
# because "KILL_ON_JOB_CLOSE is a documented basic LimitFlag". That is false in
# practice: SetInformationJobObject with JobObjectBasicLimitInformation and
# exactly that flag returns FALSE with ERROR_INVALID_PARAMETER (87), while
# JobObjectExtendedLimitInformation with the identical flag succeeds. The Job
# side therefore uses the EXTENDED struct, and the query-back reads the same
# class it was set through. Nothing is widened: the extended struct's extra
# fields are zero and each is ignored unless its own limit flag is set.
#
# AssignProcessToJobObject and IsProcessInJob need NO manifest change — both are
# declared in Win32/System/JobObjects and were already reachable.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
