[package]
name = "moe-windows-job-broker"
version = "0.1.0"
edition = "2021"
# Never published. This is the native side of the Node runner's job broker, not
# a distributable library.
publish = false

# The Job/process primitive. Imported by relative path because it is a member of
# the same workspace and has no registry existence. ANY Win32 Job or process
# syscall the broker needs comes from here — restating one locally would be a
# second, untested authority over the same kernel objects.
#
# WHO USES IT TODAY: tests/handle_inheritance.rs, which launches the probe child
# through the real production path (Job::create, then ContainedProcess::create)
# rather than through a bespoke CreateProcessW written for the test. This crate's
# own production code does no Job or process work yet — that arrives with the
# SPIDR siblings that add session and lifecycle. A regular dependency rather than
# a dev-dependency for exactly that reason: it is the crate's stated architecture,
# not a test-only convenience.
[dependencies]
moe-windows-job-core = { path = ".." }

# The SAME exact pin as the core: `=0.61.2` forbids 0.61.3, where a plain
# "0.61.2" would silently accept it. Two crates in one workspace disagreeing on
# this pin would be resolved silently by Cargo rather than reported.
#
# Features are declared per-target for the same reason the core's are: this
# crate is Windows-only by construction and has no non-Windows fallback.
#
# Win32_Storage_FileSystem is REQUIRED and is the one the core does not have:
# `GetFileType` and the `FILE_TYPE_*` constants are declared there, NOT in
# Win32_System_Threading. Without the feature the function does not exist.
#
# Win32_System_Threading provides `GetStartupInfoW` and `STARTUPINFOW`, which is
# how the CRT `lpReserved2` descriptor block is reached.
#
# Win32_Foundation provides HANDLE, INVALID_HANDLE_VALUE, CloseHandle,
# GetLastError and GetHandleInformation — the last of which the handle probe
# uses to observe what is, and is not, in its own handle table.
# Win32_System_IO is REQUIRED and is easy to miss, because the functions it
# gates do not live in it. `ReadFile` and `WriteFile` are declared in
# Win32/Storage/FileSystem, but both are `#[cfg(feature = "Win32_System_IO")]`
# because their final parameter is `*mut OVERLAPPED` and that type lives in
# Win32/System/IO. Without the feature the two functions simply do not exist,
# and the error names Storage_FileSystem — the module that has them — rather
# than the feature that is missing.
#
# We pass a null overlapped pointer, which selects the synchronous form, but the
# feature still gates the declaration.
#
# Win32_System_Pipes is REQUIRED for `PeekNamedPipe`, which is how fd0 is asked
# whether it has bytes WITHOUT waiting for them. Its own module, not
# Storage_FileSystem, despite reading a handle that module opened.
#
# Win32_Security is REQUIRED and was the exact gap the Win32_System_IO note
# above warns about, present in this crate until the store lock landed.
# `CreateFileW` is declared in Win32/Storage/FileSystem but is
# `#[cfg(feature = "Win32_Security")]`, because its fourth parameter is
# `*const SECURITY_ATTRIBUTES` and that type lives in Win32/Security. The
# broker has always called `CreateFileW`; it only ever resolved because
# moe-windows-job-core enables the feature and Cargo unifies features across
# the graph. That is not a dependency this crate declared — measured with
# `cargo tree -p moe-windows-job-broker -e features -i windows-sys`, the
# Win32_Security edge had exactly one parent and it was the core. Dropping the
# core, or the core dropping the feature, would have deleted `CreateFileW` out
# from under this crate for a reason naming neither.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

# Integration tests link the crate's PUBLIC surface plus dev-dependencies only;
# a `[dependencies]` entry is not in scope for `tests/`. tests/store_lock.rs
# calls `GetShortPathNameW` directly to obtain a real NTFS 8.3 alias, which is
# the one store-path alias no public API of this crate can produce, so the
# same pin is restated here rather than widening the crate's own surface to
# suit a test. Same `=0.61.2` exact pin, for the reason given above.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem"] }
