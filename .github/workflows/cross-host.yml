# Cross-host execution environment for platform observation evidence.
#
# Exists to satisfy the standing constraint recorded on
# task-01c5f96ec1e247dc846fd628c929974a: agent sessions run on win32, task rail 1
# forbids win32-only completion, and until now the repo had no Linux or macOS
# runner to delegate to. This workflow is that runner.
#
# fail-fast is off on purpose: a red Linux leg must not cancel the macOS leg,
# because the evidence wanted is per-host, and a cancelled leg is UNKNOWN rather
# than a result.
name: cross-host

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Vitest colorizes on GitHub-hosted runners, wrapping the count digits in ANSI
# escapes; the literal `Test Files N passed` greps below then miss a line that
# is present, and the gate refuses a leg whose tests actually passed (observed
# on run 31919018714: Tests 2 passed / executedCaseCount=21, refused as "ran no
# test file"). NO_COLOR keeps the log bytes identical to the local runs the
# greps were written against. It changes presentation only, never a condition.
env:
  NO_COLOR: "1"

jobs:
  gate:
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      # MERGE GATE: this job grades the commit GitHub would land, so it checks
      # out `github.sha` -- the ephemeral merge commit on a pull_request run and
      # the pushed commit otherwise. Evidence attribution is the OTHER contract
      # and lives in portability-evidence, which binds to the PR head instead.
      # The job token is not persisted into .git/config: nothing here pushes.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record host facts
        run: |
          echo "runner.os=${{ runner.os }}"
          echo "process.platform=$(node -p 'process.platform' 2>/dev/null || echo 'node-not-yet-installed')"
          uname -a

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.0.8

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Platform identity
        run: |
          node -p "JSON.stringify({platform: process.platform, arch: process.arch, node: process.version})"

      # tsc emits no count line, so there is nothing here to grade beyond the
      # captured exit status -- but the status is captured EXPLICITLY, out of
      # the pipeline rather than out of `tee`, so this step cannot start
      # reporting tee's success the day a filter is added to it.
      - name: Typecheck
        run: |
          set -o pipefail
          set +e
          pnpm typecheck 2>&1 | tee tsc-root-posix.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "${status}" -ne 0 ]; then exit "${status}"; fi

      # A gate must prove it EXECUTED: `vitest run` exits 0 when it matches no
      # test file, so both count lines are asserted rather than trusted -- the
      # same discipline the security, daemon and control-room lanes below
      # already apply, and the shape the windows-latest mirror already uses.
      - name: Test
        run: |
          set -o pipefail
          set +e
          pnpm test 2>&1 | tee vitest-root-posix.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "${status}" -ne 0 ]; then exit "${status}"; fi
          if ! grep -Eq '^ *Test Files +[1-9][0-9]* passed' vitest-root-posix.log; then exit 1; fi
          if ! grep -Eq '^ *Tests +[1-9][0-9]* passed' vitest-root-posix.log; then exit 1; fi

      - name: Release authority contracts
        if: always()
        run: |
          pnpm typecheck:release
          set -o pipefail
          set +e
          node --test tests/integration/release-supply-chain.test.mjs tests/integration/release/release-supply-chain.test.mjs tests/integration/release/windows-pack-observation.test.mjs tests/integration/release/verify-windows-release.test.mjs 2>&1 | tee node-release-authority-posix.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "${status}" -ne 0 ]; then exit "${status}"; fi
          if ! grep -Eq 'pass [1-9][0-9]*' node-release-authority-posix.log; then exit 1; fi
          if grep -Eq 'fail [1-9][0-9]*' node-release-authority-posix.log; then exit 1; fi

      # Root Vitest excludes apps/** and *.security.ts. Run those three product
      # populations explicitly on every supported POSIX host and reject a
      # vacuous green result as well as a nonzero exit.
      - name: Test (security)
        if: always()
        run: |
          set -o pipefail
          set +e
          pnpm test:security 2>&1 | tee vitest-security-posix.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "${status}" -ne 0 ]; then exit "${status}"; fi
          if ! grep -Eq '^ *Test Files +[1-9][0-9]* passed' vitest-security-posix.log; then exit 1; fi
          if ! grep -Eq '^ *Tests +[1-9][0-9]* passed' vitest-security-posix.log; then exit 1; fi

      - name: Test (daemon app)
        if: always()
        run: |
          set -o pipefail
          set +e
          pnpm --filter @moe/daemon test 2>&1 | tee vitest-daemon-posix.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "${status}" -ne 0 ]; then exit "${status}"; fi
          if ! grep -Eq '^ *Test Files +[1-9][0-9]* passed' vitest-daemon-posix.log; then exit 1; fi
          if ! grep -Eq '^ *Tests +[1-9][0-9]* passed' vitest-daemon-posix.log; then exit 1; fi

      - name: Test (control-room app)
        if: always()
        run: |
          set -o pipefail
          set +e
          pnpm --filter @moe/control-room test 2>&1 | tee vitest-control-room-posix.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "${status}" -ne 0 ]; then exit "${status}"; fi
          if ! grep -Eq '^ *Test Files +[1-9][0-9]* passed' vitest-control-room-posix.log; then exit 1; fi
          if ! grep -Eq '^ *Tests +[1-9][0-9]* passed' vitest-control-room-posix.log; then exit 1; fi

  # THE WINDOWS LANE v0.1 SHIPS ON (task-1162c002).
  #
  # A SEPARATE job, not a third leg of `gate`'s matrix, because its native setup
  # and PowerShell evidence parsing differ from the POSIX rows. The application
  # and security populations below are nevertheless mirrored in `gate` above.
  #
  # SCOPE for v0.1: the two local gates, `pnpm typecheck` and `pnpm test`, PLUS
  # four populations the root suite never executes. Each is its own step with
  # its own count-line assertion, so one red names its lane rather than reading
  # as a generic windows failure.
  #
  #   security lane      `*.security.ts`, incl. the completeness ratchet. The
  #                      root include is `*.test.ts` only.
  #   apps/daemon        colocated `src` suites. Root vitest includes only
  #   apps/control-room  adapters/**, packages/**, tests/** — apps/** is
  #                      not discovered by the root command.
  #   release authority  the three standalone `.mjs` contracts plus their
  #                      production-reader typecheck. Root Vitest discovers
  #                      none of them; this step makes the protected host rows
  #                      cover the candidate, receipt, and final verifier.
  #
  # Counts are deliberately NOT pinned anywhere below: the assertions demand a
  # POSITIVE count, never a particular one, so a growing suite cannot red the
  # gate. For scale only, measured on win32/pwsh at b41a33d 2026-08-20: security
  # 10 files / 557 cases, daemon 178 / 3936, control-room 73 / 907. The release
  # authority count is deliberately observed rather than pinned.
  # test:integration's vitest leg already runs inside `pnpm test`
  # (root include covers tests/**); its packaging typecheck stays OUT — it is
  # exercised by the artifact task's own gates. Revisit at v0.2.
  #
  # NO `shell: bash` ANYWHERE HERE. windows-latest defaults to pwsh, which is the
  # shell the local gates are measured under; forcing bash would resurrect the
  # MSYS path-rewrite class this repo has already been burned by.
  gate-windows:
    name: gate (windows-latest)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      # MERGE GATE: same ruling as `gate` -- grade the commit GitHub would land,
      # `github.sha`, not the PR head. Credentials are not persisted.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # windows-latest hands a job an 8.3-MANGLED temp directory,
      # C:\Users\RUNNER~1\AppData\Local\Temp, because the runner account name is
      # longer than eight characters. Node then disagrees with itself about what
      # that path IS: `fs.realpathSync` (the JS implementation) leaves RUNNER~1
      # alone, while `fs.promises.realpath` (the libuv one) expands it to
      # runneradmin. A fixture root taken with the first and a production
      # realpath taken with the second differ by exactly that segment, so the
      # repo's path containment checks fire - measured on run 32232401182: 36
      # "escapes the fixture's native root", plus PHASE0_NODE_SOURCE_PATH_ESCAPE
      # and CLAUDE_RUNTIME_PATH_ESCAPE, 13 files red.
      #
      # RUNNER_TEMP is D:\a\_temp: every segment is short, so no 8.3 alias
      # exists and both spellings collapse to one. That is the environment a
      # normal Windows box already has (an account name under eight characters
      # is never mangled, which is why the same suite is green locally), and it
      # narrows NOTHING - the lane still runs all 299 files and all 7417 cases.
      # The fixture fragility itself is real and is NOT repaired here: it spans
      # 13 files owned by other tasks, and its two directions need opposite
      # repairs.
      #
      # Written through GITHUB_ENV rather than the job's `env:` block because a
      # job-level env may not read the `runner` context - the first attempt did,
      # and GitHub refused the whole WORKFLOW ("This run likely failed because of
      # a workflow file issue", run 32233018489, zero jobs started, which took
      # the ubuntu and macos legs down with it for that one sha). RUNNER_TEMP is
      # a plain variable, so this shape needs no context at all.
      - name: Pin the temp directory away from its 8.3 alias
        run: |
          "TEMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8


      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.0.8

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install
        id: install
        run: pnpm install --frozen-lockfile

      - name: Platform identity
        run: |
          node -p "JSON.stringify({platform: process.platform, arch: process.arch, node: process.version})"

      # ENVIRONMENT PARITY, NOT AN EXTRA GATE. `dist/` is git-ignored, so a
      # runner starts with no Windows Job native binaries, while a developer box
      # has them — which is the only reason `pnpm test` is green locally. Two
      # runner suites hard-require them: windows-boundary.test.ts asserts
      # `resolveBrokerBinary()` resolves ("a missing binary must FAIL rather than
      # degrade" is that module's stated design), and windows-boundary.smoke
      # launches detached_spawner.exe. Skipping them instead would make the lane
      # read green while testing less. The command is the one documented in
      # windows-broker-path.ts, verbatim; the toolchain is pinned by
      # native/rust-toolchain.toml and the lockfile by --locked.
      - name: Build the Windows Job native binaries
        run: cargo build --locked --release --manifest-path packages/runner/src/platform/windows/native/Cargo.toml --target-dir dist/windows-job-native -p moe-windows-job-broker

      - name: Typecheck
        run: pnpm typecheck

      # A gate must prove it EXECUTED: `vitest run` exits 0 when it matches no
      # test file at all, so the count line is asserted rather than trusted. The
      # preferences are pinned explicitly because a pwsh step defaults to
      # ErrorActionPreference=Stop, under which a native command's redirected
      # stderr (git's harmless CRLF warning, here) can abort the step before the
      # test run is graded. $LASTEXITCODE after this pipeline is pnpm's — a
      # cmdlet like Tee-Object does not touch it — which is the pwsh equivalent
      # of the PIPESTATUS read the host-evidence job performs.
      - name: Test
        env:
          # Windows publication tests take no-delete-sharing handles over their exact temp
          # ancestry. Parallel files deleting sibling temp trees create a false host race;
          # serialize this lane while each test's own process races remain intact.
          VITEST_MAX_WORKERS: 1
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          pnpm test 2>&1 | Tee-Object -FilePath vitest-windows.log
          $status = $LASTEXITCODE
          if ($status -ne 0) {
            Write-Output "::error title=gate-windows::pnpm test exited $status"
            exit 1
          }
          if (-not (Select-String -Path vitest-windows.log -Pattern '^\s*Test Files\s+[1-9][0-9]* passed' -Quiet)) {
            Write-Output "::error title=gate-windows::no positive Test Files count: the lane ran no test file"
            exit 1
          }

      # The security lane's own script typechecks the lane then runs its
      # `*.security.ts` suffix, which no root config ever matches. Same
      # executed-proof discipline as the root step: exit code AND a positive
      # count line, because a lane whose include matched nothing exits 0.
      #
      # `always()` on all four population steps, guarded on the install: a step
      # that fails would otherwise SKIP every step after it, so one red erases
      # three populations' evidence — witnessed on run 32407365014, where the
      # daemon step's red left control-room and supply-chain unreported. Skipped
      # is not green and not red; it is no evidence at all, which is exactly what
      # this job exists to stop producing. The install guard (the shape
      # portability-evidence already uses) keeps a failed setup from fabricating
      # four test failures out of one missing node_modules.
      - name: Test (security lane)
        if: ${{ always() && steps.install.conclusion == 'success' }}
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          pnpm test:security 2>&1 | Tee-Object -FilePath vitest-security.log
          $status = $LASTEXITCODE
          if ($status -ne 0) {
            Write-Output "::error title=gate-windows::pnpm test:security exited $status"
            exit 1
          }
          if (-not (Select-String -Path vitest-security.log -Pattern '^\s*Test Files\s+[1-9][0-9]* passed' -Quiet)) {
            Write-Output "::error title=gate-windows::security lane ran no test file"
            exit 1
          }
          if (-not (Select-String -Path vitest-security.log -Pattern '^\s*Tests\s+[1-9][0-9]* passed' -Quiet)) {
            Write-Output "::error title=gate-windows::security lane ran no case"
            exit 1
          }

      # apps/** is invisible to the root vitest include (adapters, packages,
      # tests only), so each app's own `test` script is the only thing that
      # executes its colocated suites. Run SERIALLY after the root suite, not
      # concurrently with it: several daemon suites carry wall-clock bounds that
      # go red under machine load, and a shared runner is exactly that.
      - name: Test (daemon app)
        if: ${{ always() && steps.install.conclusion == 'success' }}
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          pnpm --filter @moe/daemon test 2>&1 | Tee-Object -FilePath vitest-daemon.log
          $status = $LASTEXITCODE
          if ($status -ne 0) {
            Write-Output "::error title=gate-windows::daemon test exited $status"
            exit 1
          }
          if (-not (Select-String -Path vitest-daemon.log -Pattern '^\s*Test Files\s+[1-9][0-9]* passed' -Quiet)) {
            Write-Output "::error title=gate-windows::daemon suite ran no test file"
            exit 1
          }
          if (-not (Select-String -Path vitest-daemon.log -Pattern '^\s*Tests\s+[1-9][0-9]* passed' -Quiet)) {
            Write-Output "::error title=gate-windows::daemon suite ran no case"
            exit 1
          }

      - name: Test (control-room app)
        if: ${{ always() && steps.install.conclusion == 'success' }}
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          pnpm --filter @moe/control-room test 2>&1 | Tee-Object -FilePath vitest-control-room.log
          $status = $LASTEXITCODE
          if ($status -ne 0) {
            Write-Output "::error title=gate-windows::control-room test exited $status"
            exit 1
          }
          if (-not (Select-String -Path vitest-control-room.log -Pattern '^\s*Test Files\s+[1-9][0-9]* passed' -Quiet)) {
            Write-Output "::error title=gate-windows::control-room suite ran no test file"
            exit 1
          }
          if (-not (Select-String -Path vitest-control-room.log -Pattern '^\s*Tests\s+[1-9][0-9]* passed' -Quiet)) {
            Write-Output "::error title=gate-windows::control-room suite ran no case"
            exit 1
          }

      # The root Vitest command does not discover these standalone .mjs release
      # authority contracts. Typecheck their production readers and execute all
      # four with a positive node:test pass count before this protected check
      # can turn green.
      - name: Release authority contracts
        if: ${{ always() && steps.install.conclusion == 'success' }}
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          pnpm typecheck:release
          $typecheckStatus = $LASTEXITCODE
          if ($typecheckStatus -ne 0) {
            Write-Output "::error title=gate-windows::pnpm typecheck:release exited $typecheckStatus"
            exit 1
          }
          node --test tests/integration/release-supply-chain.test.mjs tests/integration/release/release-supply-chain.test.mjs tests/integration/release/windows-pack-observation.test.mjs tests/integration/release/verify-windows-release.test.mjs 2>&1 | Tee-Object -FilePath node-release-authority-windows.log
          $status = $LASTEXITCODE
          if ($status -ne 0) {
            Write-Output "::error title=gate-windows::release authority tests exited $status"
            exit 1
          }
          if (-not (Select-String -Path node-release-authority-windows.log -Pattern 'pass [1-9][0-9]*' -Quiet)) {
            Write-Output "::error title=gate-windows::release authority tests reported no positive pass count"
            exit 1
          }
          if (Select-String -Path node-release-authority-windows.log -Pattern 'fail [1-9][0-9]*' -Quiet) {
            Write-Output "::error title=gate-windows::release authority tests reported failures"
            exit 1
          }

      # THE WINDOWS HALF OF THE PORTABILITY MIRROR. `portability-evidence` is
      # ubuntu/macos-only (see its header), so until now three release-relevant
      # commands ran on no Windows runner at all: `tools/packaging/**` and
      # `tools/import/**` are in no workspace package, so `pnpm --recursive
      # typecheck` reaches neither, and `tests/migration/**` has its own vitest
      # config that no root include matches. The remaining two commands that
      # job runs are already covered here -- the release supply-chain node:test
      # by "Release authority contracts" above, and `vitest run
      # tests/integration` by the root `pnpm test`, whose include carries
      # `tests/**/*.test.ts`. Both halves of that superset claim are asserted by
      # the workflow contract test, not asserted here in prose.
      - name: Typecheck (packaging)
        if: ${{ always() && steps.install.conclusion == 'success' }}
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          pnpm typecheck:packaging 2>&1 | Tee-Object -FilePath tsc-packaging-windows.log
          $status = $LASTEXITCODE
          if ($status -ne 0) {
            Write-Output "::error title=gate-windows::pnpm typecheck:packaging exited $status"
            exit 1
          }

      - name: Typecheck (import)
        if: ${{ always() && steps.install.conclusion == 'success' }}
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          pnpm typecheck:import 2>&1 | Tee-Object -FilePath tsc-import-windows.log
          $status = $LASTEXITCODE
          if ($status -ne 0) {
            Write-Output "::error title=gate-windows::pnpm typecheck:import exited $status"
            exit 1
          }

      # The migration lane runs tests, so exit 0 is not enough: `vitest run`
      # against a config whose include matched nothing exits 0 too.
      - name: Test (migration)
        if: ${{ always() && steps.install.conclusion == 'success' }}
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          pnpm test:migration 2>&1 | Tee-Object -FilePath vitest-migration-windows.log
          $status = $LASTEXITCODE
          if ($status -ne 0) {
            Write-Output "::error title=gate-windows::pnpm test:migration exited $status"
            exit 1
          }
          if (-not (Select-String -Path vitest-migration-windows.log -Pattern '^\s*Test Files\s+[1-9][0-9]* passed' -Quiet)) {
            Write-Output "::error title=gate-windows::migration lane ran no test file"
            exit 1
          }
          if (-not (Select-String -Path vitest-migration-windows.log -Pattern '^\s*Tests\s+[1-9][0-9]* passed' -Quiet)) {
            Write-Output "::error title=gate-windows::migration lane ran no case"
            exit 1
          }

  # Host-native effect evidence for task-01c5f96ec1e247dc846fd628c929974a.
  #
  # Independent of `gate` on purpose. `gate` runs the broad repo suite and may be
  # red for reasons that belong to another task; that red stays visible rather
  # than being deleted to buy a green run, and it must not gate this evidence.
  # Nothing here can produce PROVEN off-host: the collector derives the executing
  # host from the production doctor collector, so a matrix variable, a job name
  # or an artifact name cannot promote a row.
  host-evidence:
    name: host-evidence-${{ matrix.slot }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - slot: linux
            runner: ubuntu-latest
          - slot: darwin
            runner: macos-latest
    steps:
      # MERGE GATE: host-native effect evidence is collected against the commit
      # GitHub would land, `github.sha`. Credentials are not persisted.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.0.8

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Compile the fault tree
        run: pnpm exec tsc -p tests/fault/tsconfig.json

      # `| tee` would report tee's status, so the real Vitest status is read back
      # out of PIPESTATUS. An exit 0 that printed no counts ran no tests, so the
      # count lines and the internal executed-case count are required explicitly.
      #
      # A refusal is republished as a workflow `::error::` annotation. Job logs
      # need repository admin to read, so a bare exit code makes a red host leg
      # unreadable to the agent that owns it; the annotation carries the actual
      # failing lines. It reports the refusal, it never relaxes one.
      - name: Run the host schedule
        env:
          MOE_CROSS_HOST_RAW: ${{ github.workspace }}/cross-host-raw
        run: |
          set -o pipefail
          set +e
          pnpm exec vitest run --config tests/fault/vitest.config.ts \
            ${{ matrix.slot == 'linux' && 'linux' || 'macos' }}/effect-conformance.fault.ts \
            2>&1 | tee vitest-host.log
          status=${PIPESTATUS[0]}
          set -e
          echo "vitest exit status: ${status}"
          reason=""
          if [ "${status}" -ne 0 ]; then
            reason="vitest exited ${status}"
          elif ! grep -Eq '^ *Test Files +[1-9][0-9]* passed' vitest-host.log; then
            reason="no positive Test Files count: the leg ran no test file"
          elif ! grep -Eq '^ *Tests +[1-9][0-9]* passed' vitest-host.log; then
            reason="no positive Tests count: the leg ran no case"
          elif ! grep -Fq 'executedCaseCount=21' vitest-host.log; then
            reason="executedCaseCount=21 absent: the 21-case schedule did not complete"
          fi
          if [ -n "${reason}" ]; then
            node -e 'const fs=require("node:fs");const tail=fs.readFileSync(process.argv[1],"utf8").slice(-5000);const enc=(s)=>s.replace(/%/g,"%25").replace(/\r/g,"%0D").replace(/\n/g,"%0A");process.stdout.write("::error title="+enc(process.argv[2])+"::"+enc(process.argv[2]+"\n"+tail)+"\n");' \
              vitest-host.log "host-evidence-${{ matrix.slot }} refused: ${reason}"
            exit 1
          fi

      - name: Collect the host receipt
        run: |
          set -o pipefail
          set +e
          node tests/fault/cross-host/cross-host-evidence.mjs collect \
            --slot ${{ matrix.slot }} \
            --schedule cross-host-raw/schedule-${{ matrix.slot }}.json \
            --out cross-host-receipt 2>&1 | tee collect.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "${status}" -ne 0 ]; then
            node -e 'const fs=require("node:fs");const tail=fs.readFileSync(process.argv[1],"utf8").slice(-5000);const enc=(s)=>s.replace(/%/g,"%25").replace(/\r/g,"%0D").replace(/\n/g,"%0A");process.stdout.write("::error title="+enc(process.argv[2])+"::"+enc(process.argv[2]+"\n"+tail)+"\n");' \
              collect.log "host-evidence-${{ matrix.slot }} collect refused: exit ${status}"
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cross-host-${{ matrix.slot }}-${{ github.sha }}
          path: |
            cross-host-receipt
            cross-host-raw
            vitest-host.log
          if-no-files-found: error

  # Always runs, including when a host leg failed: an aggregate that was never
  # written is indistinguishable from a job that never started, and the missing
  # row is exactly the fact worth publishing.
  cross-host-aggregate:
    name: cross-host-aggregate
    needs: [host-evidence]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # MERGE GATE: the aggregate grades the commit GitHub would land,
      # `github.sha`. Credentials are not persisted.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.0.8

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Downloaded into FIXED slots. The transport name is not authority: the
      # aggregator re-derives each row from the verified doctor identity inside
      # the receipt, so a receipt filed into the wrong slot is refused.
      - name: Download the linux receipt
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cross-host-linux-${{ github.sha }}
          path: cross-host-slots/linux-artifact

      - name: Download the darwin receipt
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cross-host-darwin-${{ github.sha }}
          path: cross-host-slots/darwin-artifact

      - name: Place each receipt in its expected slot
        run: |
          for slot in linux darwin; do
            mkdir -p "cross-host-slots/${slot}"
            if [ -d "cross-host-slots/${slot}-artifact/cross-host-receipt" ]; then
              cp "cross-host-slots/${slot}-artifact/cross-host-receipt/"*.json "cross-host-slots/${slot}/" || true
            fi
          done
          ls -R cross-host-slots

      # Same annotation channel as the host legs, for the same reason: a refusal
      # here must name itself rather than expiring into an unreadable exit code.
      - name: Compile and run the hostile contract suite
        run: |
          set -o pipefail
          set +e
          pnpm exec tsc -p tests/fault/tsconfig.json 2>&1 | tee tsc-contract.log
          tsc_status=${PIPESTATUS[0]}
          set -e
          if [ "${tsc_status}" -ne 0 ]; then
            node -e 'const fs=require("node:fs");const tail=fs.readFileSync(process.argv[1],"utf8").slice(-5000);const enc=(s)=>s.replace(/%/g,"%25").replace(/\r/g,"%0D").replace(/\n/g,"%0A");process.stdout.write("::error title="+enc(process.argv[2])+"::"+enc(process.argv[2]+"\n"+tail)+"\n");' \
              tsc-contract.log "cross-host-aggregate refused: tsc exited ${tsc_status}"
            exit 1
          fi
          set +e
          pnpm exec vitest run --config tests/fault/vitest.config.ts \
            cross-host/effect-evidence.fault.ts cross-host/production-surfaces.fault.ts \
            2>&1 | tee vitest-contract.log
          status=${PIPESTATUS[0]}
          set -e
          reason=""
          if [ "${status}" -ne 0 ]; then
            reason="vitest exited ${status}"
          elif ! grep -Eq '^ *Test Files +[1-9][0-9]* passed' vitest-contract.log; then
            reason="no positive Test Files count: the contract suite ran no test file"
          elif ! grep -Eq '^ *Tests +[1-9][0-9]* passed' vitest-contract.log; then
            reason="no positive Tests count: the contract suite ran no case"
          fi
          if [ -n "${reason}" ]; then
            node -e 'const fs=require("node:fs");const tail=fs.readFileSync(process.argv[1],"utf8").slice(-5000);const enc=(s)=>s.replace(/%/g,"%25").replace(/\r/g,"%0D").replace(/\n/g,"%0A");process.stdout.write("::error title="+enc(process.argv[2])+"::"+enc(process.argv[2]+"\n"+tail)+"\n");' \
              vitest-contract.log "cross-host-aggregate refused: ${reason}"
            exit 1
          fi

      - name: Aggregate both host rows
        run: |
          set -o pipefail
          set +e
          node tests/fault/cross-host/cross-host-evidence.mjs aggregate \
            --slots cross-host-slots \
            --out cross-host-aggregate \
            --require-complete 2>&1 | tee aggregate.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "${status}" -ne 0 ]; then
            node -e 'const fs=require("node:fs");const tail=fs.readFileSync(process.argv[1],"utf8").slice(-5000);const enc=(s)=>s.replace(/%/g,"%25").replace(/\r/g,"%0D").replace(/\n/g,"%0A");process.stdout.write("::error title="+enc(process.argv[2])+"::"+enc(process.argv[2]+"\n"+tail)+"\n");' \
              aggregate.log "cross-host-aggregate refused: exit ${status}"
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: cross-host-aggregate-${{ github.sha }}
          path: |
            cross-host-aggregate
            vitest-contract.log
          if-no-files-found: error

  # Portability evidence for task-22cfca91c5134b24aaf3e5734444fb93.
  #
  # WHY A SEPARATE JOB. `gate` already runs `pnpm typecheck` and `pnpm test` on
  # ubuntu and macos, and the root vitest include is
  # ["adapters/**/*.test.ts", "packages/**/*.test.ts", "tests/**/*.test.ts"],
  # so the portability matrices DO execute there. What `gate` cannot give is
  # ATTRIBUTION: one aggregate `Test Files N passed` line cannot say that
  # projection-, provider- and transport- each ran a case, and `gate` runs
  # neither `pnpm typecheck:packaging` nor `pnpm typecheck:import`
  # (test:integration's two typecheck legs; `pnpm --recursive typecheck` reaches
  # workspace packages only and `tools/` is in none, so nothing else type-checks
  # those files at all), nor
  # the release supply-chain node:test leg, nor `tsc -p tests/migration/tsconfig.json`
  # (test:migration's first leg). This job runs the task's two named gates whole,
  # per host, and proves each matrix executed by NAME rather than in aggregate.
  #
  # Touches no existing job. Its red cannot move `gate`, `host-evidence` or
  # `cross-host-aggregate`, and exact-sha-evidence-gate.mjs does not consult it.
  #
  # EVIDENCE ATTRIBUTION IS POSIX-ONLY -- the documented host exclusion, stated
  # here rather than left implicit. What stays on ubuntu/macos is the
  # per-matrix ARTIFACT AND HANDSHAKE MACHINERY, not the gates: the source
  # observer, the disposable-index tree reconstruction and the per-matrix
  # executed-count attribution are bash/tee/PIPESTATUS shapes whose pwsh
  # rewrite would be a second implementation of the same authority, and this
  # job's integration leg additionally runs the pack tests, which refuse under
  # Windows' tar flavour (PACK_SOURCE_TOOLCHAIN_INVALID). Every gate COMMAND
  # this job runs is therefore mirrored into `gate-windows` instead, so no
  # product surface loses Windows coverage. That mirror is not a promise: the
  # contract arm "mirrors every portability-evidence gate command onto the
  # Windows host" in tests/integration/portability/portability-workflow.test.ts
  # parses the run: blocks BELOW and refuses any command gate-windows neither
  # runs nor demonstrably supersets.
  portability-evidence:
    name: portability-evidence (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      # The ONE commit every matrix row, fixture hash and handshake in this run
      # binds to. `github.sha` is the commit on a push run but the ephemeral
      # MERGE commit on a pull_request run, and a merge sha exists nowhere in
      # history -- so the head sha is declared explicitly. The checkout observer
      # below remains the authority; this declaration can only veto a mismatch.
      MOE_PORTABILITY_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      MOE_PORTABILITY_EVIDENCE_MODE: "1"
    steps:
      # PR-HEAD EVIDENCE, not a merge gate: P1.9 binds this job's evidence to
      # the commit the PR actually names, because `github.sha` on a
      # pull_request run is an ephemeral merge commit that exists nowhere in
      # history and evidence must name a commit that does. The four merge-gate
      # jobs deliberately do the opposite. Credentials are not persisted.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify portability source checkout
        id: portability-source
        shell: bash
        run: |
          if ! git_executable="$(command -v git)"; then
            echo "::error title=portability-evidence::PORTABILITY_SOURCE_CHECKOUT_OBSERVATION_FAILED@PORTABILITY_EVIDENCE: trusted Git executable is unavailable"
            exit 1
          fi
          case "${git_executable}" in
            /*) ;;
            *)
              echo "::error title=portability-evidence::PORTABILITY_SOURCE_CHECKOUT_OBSERVATION_FAILED@PORTABILITY_EVIDENCE: Git executable is not absolute"
              exit 1
              ;;
          esac
          while IFS='=' read -r environment_entry; do
            environment_name="${environment_entry%%=*}"
            case "${environment_name}" in GIT_*) unset "${environment_name}" ;; esac
          done < <(env)
          export GIT_ATTR_NOSYSTEM="1"
          export GIT_CONFIG_GLOBAL="/dev/null"
          export GIT_CONFIG_NOSYSTEM="1"
          export GIT_NO_REPLACE_OBJECTS="1"
          export GIT_OPTIONAL_LOCKS="0"
          export GIT_TERMINAL_PROMPT="0"
          portability_git() {
            "${git_executable}" --no-replace-objects \
              -c "safe.directory=${GITHUB_WORKSPACE}" \
              -c core.fsmonitor=false -c core.untrackedCache=false \
              -C "${GITHUB_WORKSPACE}" "$@"
          }
          if ! actual_checkout_commit="$(portability_git rev-parse --verify HEAD)"; then
            echo "::error title=portability-evidence::PORTABILITY_SOURCE_CHECKOUT_OBSERVATION_FAILED@PORTABILITY_EVIDENCE: checkout HEAD is unreadable"
            exit 1
          fi
          if [ "${actual_checkout_commit}" != "${MOE_PORTABILITY_SOURCE_COMMIT}" ]; then
            echo "::error title=portability-evidence::PORTABILITY_SOURCE_COMMIT_CHECKOUT_MISMATCH@PORTABILITY_EVIDENCE: checkout ${actual_checkout_commit} does not match declared ${MOE_PORTABILITY_SOURCE_COMMIT}"
            exit 1
          fi
          if ! checkout_root="$(portability_git rev-parse --show-toplevel)" || \
             ! checkout_root="$(cd "${checkout_root}" && pwd -P)" || \
             ! workspace_root="$(cd "${GITHUB_WORKSPACE}" && pwd -P)"; then
            echo "::error title=portability-evidence::PORTABILITY_SOURCE_CHECKOUT_OBSERVATION_FAILED@PORTABILITY_EVIDENCE: checkout owner is unreadable"
            exit 1
          fi
          if [ "${checkout_root}" != "${workspace_root}" ]; then
            echo "::error title=portability-evidence::PORTABILITY_SOURCE_REPOSITORY_MISMATCH@PORTABILITY_EVIDENCE: checkout owner differs from the workflow workspace"
            exit 1
          fi
          verify_index_flags() {
            local index_entry
            local index_flags_clean=1
            local index_flags_file="${RUNNER_TEMP}/moe-portability-index-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RANDOM}-${RANDOM}"
            if ! (set -o noclobber; : > "${index_flags_file}") 2>/dev/null; then
              return 2
            fi
            if ! portability_git ls-files -v -z -- > "${index_flags_file}"; then
              rm -f -- "${index_flags_file}"
              return 2
            fi
            while IFS= read -r -d '' index_entry; do
              case "${index_entry}" in
                "H "*) ;;
                *) index_flags_clean=0; break ;;
              esac
            done < "${index_flags_file}"
            rm -f -- "${index_flags_file}" || return 2
            [ "${index_flags_clean}" -eq 1 ]
          }
          verify_worktree_tree() {
            local observed_commit="$1"
            local expected_tree real_objects reconstructed_tree tree_scratch
            local tree_status=0
            if ! expected_tree="$(portability_git rev-parse --verify "${observed_commit}^{tree}")" || \
               ! [[ "${expected_tree}" =~ ^[0-9a-f]{40}$ ]] || \
               ! real_objects="$(portability_git rev-parse --path-format=absolute --git-path objects)"; then
              return 2
            fi
            case "${real_objects}" in /*) ;; *) return 2 ;; esac
            if ! tree_scratch="$(mktemp -d "${RUNNER_TEMP}/moe-portability-tree.XXXXXX")" || \
               ! mkdir "${tree_scratch}/template" || \
               ! portability_git init --bare --quiet --template="${tree_scratch}/template" "${tree_scratch}/git"; then
              [ -z "${tree_scratch:-}" ] || rm -rf -- "${tree_scratch}"
              return 2
            fi
            (
              export GIT_DIR="${tree_scratch}/git"
              export GIT_WORK_TREE="${GITHUB_WORKSPACE}"
              export GIT_INDEX_FILE="${tree_scratch}/index"
              export GIT_OBJECT_DIRECTORY="${tree_scratch}/git/objects"
              export GIT_ALTERNATE_OBJECT_DIRECTORIES="${real_objects}"
              portability_git -c core.trustctime=true -c core.checkStat=default \
                read-tree --no-sparse-checkout "${observed_commit}^{tree}" || exit 2
              portability_git -c core.trustctime=true -c core.checkStat=default \
                add --update -- . || exit 2
              reconstructed_tree="$(portability_git -c core.trustctime=true \
                -c core.checkStat=default write-tree)" || exit 2
              [[ "${reconstructed_tree}" =~ ^[0-9a-f]{40}$ ]] || exit 2
              [ "${reconstructed_tree}" = "${expected_tree}" ] || exit 1
            ) || tree_status=$?
            rm -rf -- "${tree_scratch}" || return 2
            [ "${tree_status}" -le 1 ] || return 2
            return "${tree_status}"
          }
          index_flag_status=0
          verify_index_flags || index_flag_status=$?
          if [ "${index_flag_status}" -eq 1 ]; then
            echo "::error title=portability-evidence::PORTABILITY_SOURCE_CHECKOUT_DIRTY@PORTABILITY_EVIDENCE: special Git index flags can hide tracked checkout bytes"
            exit 1
          fi
          if [ "${index_flag_status}" -ne 0 ]; then
            echo "::error title=portability-evidence::PORTABILITY_SOURCE_CHECKOUT_OBSERVATION_FAILED@PORTABILITY_EVIDENCE: Git index flags are unreadable"
            exit 1
          fi
          tree_status=0
          verify_worktree_tree "${actual_checkout_commit}" || tree_status=$?
          if [ "${tree_status}" -eq 1 ]; then
            echo "::error title=portability-evidence::PORTABILITY_SOURCE_CHECKOUT_DIRTY@PORTABILITY_EVIDENCE: reconstructed tracked tree differs from checkout HEAD"
            exit 1
          fi
          if [ "${tree_status}" -ne 0 ]; then
            echo "::error title=portability-evidence::PORTABILITY_SOURCE_CHECKOUT_OBSERVATION_FAILED@PORTABILITY_EVIDENCE: tracked tree reconstruction failed"
            exit 1
          fi
          if ! portability_git --no-pager diff --no-ext-diff --quiet --ignore-submodules=none -- || \
             ! portability_git --no-pager diff --cached --no-ext-diff --quiet --ignore-submodules=none --; then
            echo "::error title=portability-evidence::PORTABILITY_SOURCE_CHECKOUT_DIRTY@PORTABILITY_EVIDENCE: tracked checkout bytes differ from HEAD"
            exit 1
          fi
          if ! confirmed_checkout_commit="$(portability_git rev-parse --verify HEAD)"; then
            echo "::error title=portability-evidence::PORTABILITY_SOURCE_CHECKOUT_OBSERVATION_FAILED@PORTABILITY_EVIDENCE: checkout HEAD cannot be re-read"
            exit 1
          fi
          if [ "${confirmed_checkout_commit}" != "${actual_checkout_commit}" ]; then
            echo "::error title=portability-evidence::PORTABILITY_SOURCE_CHECKOUT_OBSERVATION_FAILED@PORTABILITY_EVIDENCE: checkout HEAD changed during verification"
            exit 1
          fi
          echo "MOE_PORTABILITY_SOURCE_COMMIT=${actual_checkout_commit}" >> "${GITHUB_ENV}"
          echo "source_commit=${actual_checkout_commit}" >> "${GITHUB_OUTPUT}"
          echo "git_executable=${git_executable}" >> "${GITHUB_OUTPUT}"

      - name: Record host facts
        run: |
          echo "runner.os=${{ runner.os }}"
          echo "bound source commit=${MOE_PORTABILITY_SOURCE_COMMIT}"
          uname -a

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.0.8

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install
        id: install
        run: pnpm install --frozen-lockfile

      # Exit code alone is not evidence: `pnpm --filter <pkg>` on an absent
      # package, and a vitest run whose include matched nothing, both exit 0.
      # Every leg below therefore asserts a POSITIVE count line as well, and
      # captures ${PIPESTATUS[0]} because a piped run reports tee's exit.
      - name: Integration gate (vitest)
        env:
          MOE_PORTABILITY_GIT_EXECUTABLE: ${{ steps.portability-source.outputs.git_executable }}
          MOE_PORTABILITY_SOURCE_COMMIT: ${{ steps.portability-source.outputs.source_commit }}
        run: |
          set -o pipefail
          set +e
          pnpm typecheck:packaging 2>&1 | tee portability-integration.log
          typecheck_status=${PIPESTATUS[0]}
          pnpm typecheck:import 2>&1 | tee -a portability-integration.log
          import_typecheck_status=${PIPESTATUS[0]}
          pnpm exec vitest run tests/integration 2>&1 | tee -a portability-integration.log
          vitest_status=${PIPESTATUS[0]}
          set -e
          failed=0
          if [ "${typecheck_status}" -ne 0 ]; then
            echo "::error title=portability-evidence::pnpm typecheck:packaging exited ${typecheck_status}"
            failed=1
          fi
          if [ "${import_typecheck_status}" -ne 0 ]; then
            echo "::error title=portability-evidence::pnpm typecheck:import exited ${import_typecheck_status}"
            failed=1
          fi
          if [ "${vitest_status}" -ne 0 ]; then
            echo "::error title=portability-evidence::integration vitest exited ${vitest_status}"
            failed=1
          fi
          if [ "${failed}" -ne 0 ]; then
            exit 1
          fi
          if ! grep -Eq '^ *Test Files +[1-9][0-9]* passed' portability-integration.log; then
            echo "::error title=portability-evidence::integration vitest leg ran no test file"
            exit 1
          fi
          if ! grep -Eq '^ *Tests +[1-9][0-9]* passed' portability-integration.log; then
            echo "::error title=portability-evidence::integration vitest leg ran no case"
            exit 1
          fi

      # `always()` keeps this evidence leg independent from the sibling vitest
      # result. The install guard deliberately skips after failed setup instead
      # of fabricating a release-supply-chain test failure.
      - name: Release supply-chain gate (node:test)
        id: release-supply-chain
        if: ${{ always() && steps.install.conclusion == 'success' }}
        run: |
          set -o pipefail
          set +e
          node --test tests/integration/release-supply-chain.test.mjs 2>&1 | tee portability-supply-chain.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "${status}" -ne 0 ]; then
            echo "::error title=portability-evidence::release supply-chain node:test exited ${status}"
            exit 1
          fi
          if ! grep -Eq 'pass [1-9][0-9]*' portability-supply-chain.log; then
            echo "::error title=portability-evidence::release supply-chain node:test reported no pass count"
            exit 1
          fi
          if grep -Eq 'fail [1-9][0-9]*' portability-supply-chain.log; then
            echo "::error title=portability-evidence::release supply-chain node:test reported failures"
            exit 1
          fi

      - name: Migration gate
        run: |
          set -o pipefail
          set +e
          pnpm test:migration 2>&1 | tee portability-migration.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "${status}" -ne 0 ]; then
            echo "::error title=portability-evidence::pnpm test:migration exited ${status}"
            exit 1
          fi
          if ! grep -Eq '^ *Test Files +[1-9][0-9]* passed' portability-migration.log; then
            echo "::error title=portability-evidence::migration lane ran no test file"
            exit 1
          fi
          if ! grep -Eq '^ *Tests +[1-9][0-9]* passed' portability-migration.log; then
            echo "::error title=portability-evidence::migration lane ran no case"
            exit 1
          fi

      # Per-matrix attribution. An aggregate count cannot show that EACH matrix
      # executed, and a matrix that silently produced zero rows would pass every
      # check above. This step refuses unless every named matrix reports a
      # positive executed-case count on this host.
      - name: Per-matrix executed counts
        env:
          MOE_PORTABILITY_GIT_EXECUTABLE: ${{ steps.portability-source.outputs.git_executable }}
          MOE_PORTABILITY_SOURCE_COMMIT: ${{ steps.portability-source.outputs.source_commit }}
        run: |
          set -o pipefail
          set +e
          npx vitest run tests/integration/portability \
            --reporter=json --outputFile=portability-matrix.json 2>&1 | tee portability-matrix.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "${status}" -ne 0 ]; then
            echo "::error title=portability-evidence::portability matrices exited ${status}"
            exit 1
          fi
          node -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync("portability-matrix.json", "utf8"));
            const required = [
              "projection-shadow-matrix.test.ts",
              "provider-shadow-matrix.test.ts",
              "transport-host-matrix.test.ts",
              "portability-historical-receipt.test.ts",
              "portability-source-commit.test.ts",
              "portability-workflow.test.ts",
              "bin-target-modes.test.ts",
            ];
            const counts = new Map();
            for (const file of report.testResults) {
              const name = file.name.split(/[\\/]/).pop();
              const passed = file.assertionResults.filter((a) => a.status === "passed").length;
              counts.set(name, (counts.get(name) ?? 0) + passed);
            }
            const missing = required.filter((name) => (counts.get(name) ?? 0) === 0);
            for (const name of required) {
              console.log(`${name}: ${counts.get(name) ?? 0} passed`);
            }
            if (missing.length > 0) {
              console.log(`::error title=portability-evidence::matrices executed no case: ${missing.join(", ")}`);
              process.exit(1);
            }
            if (report.numFailedTests !== 0) {
              console.log(`::error title=portability-evidence::${report.numFailedTests} portability cases failed`);
              process.exit(1);
            }
          '

      - name: Reverify portability source checkout
        if: always()
        env:
          EXPECTED_GIT_EXECUTABLE: ${{ steps.portability-source.outputs.git_executable }}
          EXPECTED_PORTABILITY_SOURCE_COMMIT: ${{ steps.portability-source.outputs.source_commit }}
        shell: bash
        run: |
          while IFS='=' read -r environment_entry; do
            environment_name="${environment_entry%%=*}"
            case "${environment_name}" in GIT_*) unset "${environment_name}" ;; esac
          done < <(env)
          export GIT_ATTR_NOSYSTEM="1"
          export GIT_CONFIG_GLOBAL="/dev/null"
          export GIT_CONFIG_NOSYSTEM="1"
          export GIT_NO_REPLACE_OBJECTS="1"
          export GIT_OPTIONAL_LOCKS="0"
          export GIT_TERMINAL_PROMPT="0"
          portability_git() {
            "${EXPECTED_GIT_EXECUTABLE}" --no-replace-objects \
              -c "safe.directory=${GITHUB_WORKSPACE}" \
              -c core.fsmonitor=false -c core.untrackedCache=false \
              -C "${GITHUB_WORKSPACE}" "$@"
          }
          if [ -z "${EXPECTED_GIT_EXECUTABLE}" ] || \
             ! actual_checkout_commit="$(portability_git rev-parse --verify HEAD)"; then
            echo "::error title=portability-evidence::PORTABILITY_SOURCE_CHECKOUT_OBSERVATION_FAILED@PORTABILITY_EVIDENCE: final checkout HEAD is unreadable"
            exit 1
          fi
          if [ "${actual_checkout_commit}" != "${EXPECTED_PORTABILITY_SOURCE_COMMIT}" ]; then
            echo "::error title=portability-evidence::PORTABILITY_SOURCE_COMMIT_CHECKOUT_MISMATCH@PORTABILITY_EVIDENCE: final checkout ${actual_checkout_commit} does not match observed ${EXPECTED_PORTABILITY_SOURCE_COMMIT}"
            exit 1
          fi
          if ! checkout_root="$(portability_git rev-parse --show-toplevel)" || \
             ! checkout_root="$(cd "${checkout_root}" && pwd -P)" || \
             ! workspace_root="$(cd "${GITHUB_WORKSPACE}" && pwd -P)"; then
            echo "::error title=portability-evidence::PORTABILITY_SOURCE_CHECKOUT_OBSERVATION_FAILED@PORTABILITY_EVIDENCE: final checkout owner is unreadable"
            exit 1
          fi
          if [ "${checkout_root}" != "${workspace_root}" ]; then
            echo "::error title=portability-evidence::PORTABILITY_SOURCE_REPOSITORY_MISMATCH@PORTABILITY_EVIDENCE: final checkout owner differs from the workflow workspace"
            exit 1
          fi
          verify_index_flags() {
            local index_entry
            local index_flags_clean=1
            local index_flags_file="${RUNNER_TEMP}/moe-portability-index-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RANDOM}-${RANDOM}"
            if ! (set -o noclobber; : > "${index_flags_file}") 2>/dev/null; then
              return 2
            fi
            if ! portability_git ls-files -v -z -- > "${index_flags_file}"; then
              rm -f -- "${index_flags_file}"
              return 2
            fi
            while IFS= read -r -d '' index_entry; do
              case "${index_entry}" in
                "H "*) ;;
                *) index_flags_clean=0; break ;;
              esac
            done < "${index_flags_file}"
            rm -f -- "${index_flags_file}" || return 2
            [ "${index_flags_clean}" -eq 1 ]
          }
          verify_worktree_tree() {
            local observed_commit="$1"
            local expected_tree real_objects reconstructed_tree tree_scratch
            local tree_status=0
            if ! expected_tree="$(portability_git rev-parse --verify "${observed_commit}^{tree}")" || \
               ! [[ "${expected_tree}" =~ ^[0-9a-f]{40}$ ]] || \
               ! real_objects="$(portability_git rev-parse --path-format=absolute --git-path objects)"; then
              return 2
            fi
            case "${real_objects}" in /*) ;; *) return 2 ;; esac
            if ! tree_scratch="$(mktemp -d "${RUNNER_TEMP}/moe-portability-tree.XXXXXX")" || \
               ! mkdir "${tree_scratch}/template" || \
               ! portability_git init --bare --quiet --template="${tree_scratch}/template" "${tree_scratch}/git"; then
              [ -z "${tree_scratch:-}" ] || rm -rf -- "${tree_scratch}"
              return 2
            fi
            (
              export GIT_DIR="${tree_scratch}/git"
              export GIT_WORK_TREE="${GITHUB_WORKSPACE}"
              export GIT_INDEX_FILE="${tree_scratch}/index"
              export GIT_OBJECT_DIRECTORY="${tree_scratch}/git/objects"
              export GIT_ALTERNATE_OBJECT_DIRECTORIES="${real_objects}"
              portability_git -c core.trustctime=true -c core.checkStat=default \
                read-tree --no-sparse-checkout "${observed_commit}^{tree}" || exit 2
              portability_git -c core.trustctime=true -c core.checkStat=default \
                add --update -- . || exit 2
              reconstructed_tree="$(portability_git -c core.trustctime=true \
                -c core.checkStat=default write-tree)" || exit 2
              [[ "${reconstructed_tree}" =~ ^[0-9a-f]{40}$ ]] || exit 2
              [ "${reconstructed_tree}" = "${expected_tree}" ] || exit 1
            ) || tree_status=$?
            rm -rf -- "${tree_scratch}" || return 2
            [ "${tree_status}" -le 1 ] || return 2
            return "${tree_status}"
          }
          index_flag_status=0
          verify_index_flags || index_flag_status=$?
          if [ "${index_flag_status}" -eq 1 ]; then
            echo "::error title=portability-evidence::PORTABILITY_SOURCE_CHECKOUT_DIRTY@PORTABILITY_EVIDENCE: special Git index flags can hide final tracked checkout bytes"
            exit 1
          fi
          if [ "${index_flag_status}" -ne 0 ]; then
            echo "::error title=portability-evidence::PORTABILITY_SOURCE_CHECKOUT_OBSERVATION_FAILED@PORTABILITY_EVIDENCE: final Git index flags are unreadable"
            exit 1
          fi
          tree_status=0
          verify_worktree_tree "${actual_checkout_commit}" || tree_status=$?
          if [ "${tree_status}" -eq 1 ]; then
            echo "::error title=portability-evidence::PORTABILITY_SOURCE_CHECKOUT_DIRTY@PORTABILITY_EVIDENCE: final reconstructed tracked tree differs from checkout HEAD"
            exit 1
          fi
          if [ "${tree_status}" -ne 0 ]; then
            echo "::error title=portability-evidence::PORTABILITY_SOURCE_CHECKOUT_OBSERVATION_FAILED@PORTABILITY_EVIDENCE: final tracked tree reconstruction failed"
            exit 1
          fi
          if ! portability_git --no-pager diff --no-ext-diff --quiet --ignore-submodules=none -- || \
             ! portability_git --no-pager diff --cached --no-ext-diff --quiet --ignore-submodules=none --; then
            echo "::error title=portability-evidence::PORTABILITY_SOURCE_CHECKOUT_DIRTY@PORTABILITY_EVIDENCE: final tracked checkout bytes differ from HEAD"
            exit 1
          fi
          if ! confirmed_checkout_commit="$(portability_git rev-parse --verify HEAD)"; then
            echo "::error title=portability-evidence::PORTABILITY_SOURCE_CHECKOUT_OBSERVATION_FAILED@PORTABILITY_EVIDENCE: final checkout HEAD cannot be re-read"
            exit 1
          fi
          if [ "${confirmed_checkout_commit}" != "${actual_checkout_commit}" ]; then
            echo "::error title=portability-evidence::PORTABILITY_SOURCE_CHECKOUT_OBSERVATION_FAILED@PORTABILITY_EVIDENCE: final checkout HEAD changed during verification"
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: portability-evidence-${{ matrix.os }}-${{ steps.portability-source.outputs.source_commit }}
          path: |
            portability-integration.log
            portability-supply-chain.log
            portability-migration.log
            portability-matrix.json
            portability-matrix.log
          if-no-files-found: error
